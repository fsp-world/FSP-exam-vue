name: Deploy Vue App to Aliyun ECS

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build
        # 默认输出目录是 dist/，如果是其他目录（如 build/），请在下文相应修改

      # 5. 通过 rsync 上传 dist/ 内容到 ECS
      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /opt/web/exam/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}
          remote_port: ${{ secrets.SERVER_PORT || 22 }}

      # 6. 刷新阿里云 CDN 目录缓存（方式一：目录刷新）
      - name: Setup Aliyun CLI
        uses: jerray/setup-aliyun-cli-action@v1.0.2 # 1. 安装CLI工具
        with:
          aliyun-cli-version: '3.3.22'
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          region: cn-hangzhou

      - name: Purge Aliyun CDN Cache
        run: | # 2. 执行刷新命令
          aliyun cdn RefreshObjectCaches \
            --ObjectPath "${{ secrets.CDN_REFRESH_URL }}" \
            --ObjectType Directory \
            --region cn-hangzhou
